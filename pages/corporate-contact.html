<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Dystil Corporate</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="corporate-contact-page">
            <div class="contact-hero">
                <h1>
                    Start Your <br>
                    <span>Upskilling Journey.</span>
                </h1>

                <p>
                    Tell us about your team and your specific goals. We'll design a
                    learning path mapped to your organizational engine.
                </p>

                <div class="contact-info-row">
                    <div>
                        <span>♧</span>
                        <div>
                            <h3>Phone</h3>
                            <p>+123456789</p>
                        </div>
                    </div>

                    <div>
                        <span>✉</span>
                        <div>
                            <h3>Email</h3>
                            <p>example@dystil.com</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="contact-process">
                <h2>Process</h2>

                <div class="process-row">
                    <div><span>1</span> Workflow Audit</div>
                    <div><span>2</span> Role-Based Design</div>
                    <div><span>3</span> Phased Deployment</div>
                </div>
            </div>

            <form class="corporate-contact-form">
                <label>Full Name *</label>
                <input type="text" placeholder="John" required>

                <label>info@dystil.com *</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Company *</label>
                <input type="text" placeholder="Dystil" required>

                <label>Primary Focus Area *</label>
                <select required>
                    <option value=""></option>
                    <option>AI Upskilling</option>
                    <option>Workflow Audit</option>
                    <option>Role-Based Training</option>
                    <option>Enterprise Platform</option>
                </select>

                <label>Biggest Challenge?</label>
                <textarea placeholder="Give a detailed example"></textarea>

                <button type="submit">Get Custom Roadmap</button>
            </form>
        </section>
    </main>

    <div id="footer"></div>

    <script src="../assets/js/script.js"></script>
    <script>
        loadCorporateLayout();
    </script>
</body>
</html>
