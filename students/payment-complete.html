<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | DYSTIL Launchpad</title>
    <meta name="description" content="Confirmation page for the Dystil Launchpad bootcamp programme fee.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://dystil.ai/students/payment-complete">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/images/favicon.png">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="form-section">
            <h1 id="payment-heading">Thank you</h1>
            <p id="payment-message">Your payment is being confirmed.</p>

            <p class="form-status form-status-success" id="payment-reference" role="status" aria-live="polite" hidden></p>

            <p id="payment-next">Stripe emails you a receipt, and we email you the joining details once your place is confirmed. If anything looks wrong, email <a href="mailto:askus@dystil.ai">askus@dystil.ai</a> quoting your reference.</p>

            <p><a class="register-btn" href="/students/home">Back to Dystil Launchpad</a></p>
        </section>
    </main>

    <div id="footer"></div>
    <script src="/assets/js/script.js"></script>
    <script>
        loadStudentLayout();
    </script>
    <script>
        /* Stripe returns people here either way, with ?cancelled=1 when they
           backed out. Nothing on this page decides whether a payment happened:
           only the signed webhook does that. This just says what to expect. */
        (function () {
            var parameters = new URLSearchParams(window.location.search);
            var reference = (parameters.get("ref") || "").slice(0, 30);
            var cancelled = parameters.get("cancelled") === "1";

            if (cancelled) {
                /* A green confirmation box under "Payment not completed" would
                   say the opposite of the heading above it. */
                document.getElementById("payment-reference").classList.remove("form-status-success");
                document.getElementById("payment-heading").textContent = "Payment not completed";
                document.getElementById("payment-message").textContent =
                    "Your registration is saved, but the programme fee has not been paid yet, so your place is not confirmed.";
                document.getElementById("payment-next").innerHTML =
                    "Email <a href=\"mailto:askus@dystil.ai\">askus@dystil.ai</a> quoting your reference and we will send you a payment link, or register again to start the payment over.";
            } else {
                document.getElementById("payment-message").textContent =
                    "Thank you — your programme fee has been received and your place is being confirmed.";
            }

            if (reference) {
                var line = document.getElementById("payment-reference");
                line.textContent = "Your reference is " + reference;
                line.hidden = false;
            }
        })();
    </script>
    <script src="/assets/js/mobile-menu.js"></script>
</body>
</html>
