<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Dystil Corporate</title>
    <meta name="description" content="Talk to Dystil about AI upskilling for your teams. Share your focus area and biggest challenge, and we'll design a role-based AI adoption roadmap.">
    <link rel="canonical" href="https://dystil.ai/corporate/contact">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DYSTIL">
    <meta property="og:title" content="Contact | Dystil Corporate">
    <meta property="og:description" content="Talk to Dystil about AI upskilling for your teams. Share your focus area and biggest challenge, and we'll design a role-based AI adoption roadmap.">
    <meta property="og:url" content="https://dystil.ai/corporate/contact">
    <meta property="og:image" content="https://dystil.ai/assets/images/social-preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1536">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="DYSTIL logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact | Dystil Corporate">
    <meta name="twitter:description" content="Talk to Dystil about AI upskilling for your teams. Share your focus area and biggest challenge, and we'll design a role-based AI adoption roadmap.">
    <meta name="twitter:image" content="https://dystil.ai/assets/images/social-preview.png">
    <meta name="twitter:image:alt" content="DYSTIL logo">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/images/favicon.png">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="corporate-contact-page">
            <div class="contact-hero">
                <h1>
                    Start Your <br>
                    <span>Upskilling Journey.</span>
                </h1>

                <p>
                    Tell us about your team and your specific goals. We'll design a
                    learning path mapped to your organizational engine.
                </p>

                <div class="contact-info-row">
                    <div>
                        <span>♧</span>
                        <div>
                            <h3>Phone</h3>
                            <p>+123456789</p>
                        </div>
                    </div>

                    <div>
                        <span>✉</span>
                        <div>
                            <h3>Email</h3>
                            <p><a href="mailto:askus@dystil.ai">askus@dystil.ai</a></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="contact-process">
                <h2>Process</h2>

                <div class="process-row">
                    <div><span>1</span> Workflow Audit</div>
                    <div><span>2</span> Role-Based Design</div>
                    <div><span>3</span> Phased Deployment</div>
                </div>
            </div>

            <form class="corporate-contact-form" method="post" data-enquiry-form data-form-type="Corporate Enquiry">
                <label for="corporate-full-name">Full Name *</label>
                <input id="corporate-full-name" name="fullName" type="text" placeholder="John" autocomplete="name" maxlength="120" required>

                <label for="corporate-email">Work Email *</label>
                <input id="corporate-email" name="email" type="email" placeholder="Enter your email" autocomplete="email" maxlength="254" required>

                <label for="corporate-company">Company *</label>
                <input id="corporate-company" name="company" type="text" placeholder="Dystil" autocomplete="organization" maxlength="160" required>

                <label for="corporate-focus">Primary Focus Area *</label>
                <select id="corporate-focus" name="focusArea" required>
                    <option value=""></option>
                    <option>AI Upskilling</option>
                    <option>Workflow Audit</option>
                    <option>Role-Based Training</option>
                    <option>Enterprise Platform</option>
                </select>

                <label for="corporate-challenge">Biggest Challenge?</label>
                <textarea id="corporate-challenge" name="challenge" placeholder="Give a detailed example" maxlength="4000"></textarea>

                <div class="form-honeypot" aria-hidden="true">
                    <label for="corporate-website">Website</label>
                    <input id="corporate-website" name="website" type="text" tabindex="-1" autocomplete="off">
                </div>

                <button type="submit">Get Custom Roadmap</button>
                <p class="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <div id="footer"></div>

    <script src="/assets/js/form-config.js"></script>
    <script src="/assets/js/script.js"></script>
    <script>
        loadCorporateLayout();
    </script>
    <script src="/assets/js/mobile-menu.js"></script>
</body>
</html>
