name = "dystil-contact"
main = "server.js"
compatibility_date = "2026-08-02"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "dystil-submissions"
database_id = "4a352612-0ed3-4187-a0c5-14eae4e8ac34"

# Where a CV waits while its registration is unpaid. Nothing lives here for
# long: the file is attached to the notification email and deleted the moment
# the fee is paid, and an abandoned one is cleared out after a day.
[[r2_buckets]]
binding = "CV_STORE"
bucket_name = "dystil-pending-cvs"

[vars]
ALLOWED_ORIGINS = "https://dystil.ai,https://www.dystil.ai"
ADMIN_EMAIL = "askus@dystil.ai"
# The Web Analytics site tag, which the GraphQL API filters on. This is NOT
# the beacon token in script.js: that is the site token, a different value on
# the same site. The tag is the one in the dashboard URL for the site.
# The account ID and the API token are secrets, set with "wrangler secret put".
CF_SITE_TAG = "eb62686eee01437ebd7b843ea889a796"
FROM_EMAIL = "askus@dystil.ai"
